name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download upstream mod jars (not committed)
        shell: bash
        run: |
          set -e
          mkdir -p libs
          # 从上游 GitHub Releases 拉取两个依赖 mod 的 1.20.1 构建到 libs/。
          fetch() {
            local repo="$1" filter="$2" out="$3"
            local url
            url="$(curl -fsSL "https://api.github.com/repos/${repo}/releases?per_page=30" \
              | jq -r '.[].assets[].browser_download_url' | grep -i "${filter}" | head -n 1 || true)"
            if [ -z "${url}" ]; then
              echo "::error::No asset matching '${filter}' in ${repo} recent releases; update this workflow."
              exit 1
            fi
            echo "Downloading libs/${out} from ${url}"
            curl -fsSL -o "libs/${out}" "${url}"
          }
          # 车万女仆 TLM
          # ⚠️ 第三个参数是“本地保存文件名”，必须与 build.gradle 的 flatDir 坐标（blank:xxx）完全一致；
          fetch "tartaricacid/TouhouLittleMaid" "1.20.1" "touhoulittlemaid-1.5.3-forge-mc1.20.1.jar"
          # 无尽贪婪：重生 Re-Avaritia
          fetch "Nova-Committee/Avaritia" "1.20.1" "Re-Avaritia-forge-1.20.1-1.4.0-release.jar"

      - name: Build with Gradle
        run: ./gradlew build