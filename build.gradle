plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    // ForgeGradle 6：Forge 1.20.1 + Java 17 环境，不再需要 ModDevGradle 的 JDK 21 运行时
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0'
    id 'org.spongepowered.mixin' version '0.7.38'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.20.1 与 ForgeGradle 6 均以 Java 17 作为编译与运行工具链
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    // Parchment 参数名映射；版本号由 parchment_minecraft_version + parchment_mappings_version 拼出
    mappings channel: 'parchment', version: "${parchment_mappings_version}-${parchment_minecraft_version}"

    runs {
        // 所有 run 配置的通用项
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }

        client {
            property 'forge.enabledGameTestNamespaces', project.mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            args '--nogui'
            property 'forge.enabledGameTestNamespaces', project.mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', project.mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        data {
            args '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()

    // libs/ 下的裸 mod jar（gitignored，由 CI 或本地放入）：
    // 文件名即 artifactId，不要求 Maven 坐标带版本号，因此用 Ivy 仓库按原始文件名解析
    ivy {
        url = uri('libs')
        patternLayout {
            artifact '[artifact].[ext]'
        }
        metadataSources {
            artifact()
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // 车万女仆与无尽贪婪：本地生产 jar 需先 fg.deobf 再进入编译/运行类路径
    implementation fg.deobf("blank:touhoulittlemaid-1.5.3-forge-mc1.20.1:1.0")
    implementation fg.deobf("blank:Re-Avaritia-forge-1.20.1-1.4.0-release:1.0")

    // JetBrains 注解（@Nullable/@NotNull）：编译期需要，CLASS retention 运行时无需携带
    compileOnly "org.jetbrains:annotations:23.0.0"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

jar {
    // 产物固定命名为 TML_Avaritia_addon-<mod_version>-MC<minecraft_version>+forge.jar
    archiveFileName = "TML_Avaritia_addon-${mod_version}-MC${minecraft_version}+forge.jar"
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json"
    ])
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : minecraft_version_range,
            forge_version            : forge_version,
            forge_version_range      : forge_version_range,
            loader_version_range     : loader_version_range,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
            mod_authors              : mod_authors,
            mod_description          : mod_description
    ]
    filteringCharset = 'UTF-8'
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
